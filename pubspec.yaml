name: oche_web
description: >-
  A minimalist and flexible web framework for Dart, inspired by Express.js,
  with routing, middleware, sessions, JWT, webhooks and templates.
version: 0.1.0
repository: https://github.com/claudiovictors/oche
issue_tracker: https://github.com/claudiovictors/oche/issues
topics:
  - web
  - server
  - http
  - framework
  - express

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  path: ^1.9.0
  crypto: ^3.0.3

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0